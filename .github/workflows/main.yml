# Build once, deploy to every firm in deploy/firms.json (one Azure Web App per firm).
#
# Per-firm GitHub Environment (matches githubEnvironment in firms.json):
#   AZURE_WEBAPP_PUBLISH_PROFILE
#
# Legacy single app (no deploy/firms.json): set repo secret AZURE_WEBAPP_NAME + AZURE_WEBAPP_PUBLISH_PROFILE
#
# Optional OIDC for all firms: repository variable USE_AZURE_OIDC=true plus
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID

name: Build and deploy Node.js app to Azure Web App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: npm install, build, and test
        run: |
          npm ci
          npm run build --if-present
          npm test

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  prepare-firms:
    runs-on: ubuntu-latest
    outputs:
      firms_json: ${{ steps.firms.outputs.firms_json }}
    steps:
      - uses: actions/checkout@v4

      - name: Load firm deployment matrix
        id: firms
        run: |
          if [ -f deploy/firms.json ]; then
            FIRMS=$(jq -c '.firms' deploy/firms.json)
            if [ "$FIRMS" = "null" ] || [ "$FIRMS" = "[]" ]; then
              echo "deploy/firms.json has no firms"
              exit 1
            fi
            echo "firms_json=$FIRMS" >> "$GITHUB_OUTPUT"
          else
            NAME="${{ secrets.AZURE_WEBAPP_NAME }}"
            if [ -z "$NAME" ]; then
              echo "No deploy/firms.json and AZURE_WEBAPP_NAME secret is empty"
              exit 1
            fi
            echo "firms_json=[{\"id\":\"legacy\",\"azureWebAppName\":\"$NAME\",\"githubEnvironment\":\"Production\"}]" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: [build, prepare-firms]
    strategy:
      fail-fast: false
      matrix:
        firm: ${{ fromJson(needs.prepare-firms.outputs.firms_json) }}
    permissions:
      contents: read
      id-token: write
    environment:
      name: ${{ matrix.firm.githubEnvironment || 'Production' }}
      url: ${{ steps.deploy-oidc.outputs.webapp-url || steps.deploy-profile.outputs.webapp-url }}
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure (OIDC)
        if: vars.USE_AZURE_OIDC == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App (OIDC)
        if: vars.USE_AZURE_OIDC == 'true'
        id: deploy-oidc
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ matrix.firm.azureWebAppName }}
          package: .

      - name: Deploy to Azure Web App (publish profile)
        if: vars.USE_AZURE_OIDC != 'true'
        id: deploy-profile
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ matrix.firm.azureWebAppName }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
