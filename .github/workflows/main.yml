# Build and deploy to Azure App Service.
#
# Required secrets:
#   AZURE_WEBAPP_NAME
#   AZURE_WEBAPP_PUBLISH_PROFILE   — from Azure Portal → Web App → Download publish profile
#
# Optional (OIDC instead of publish profile): set repository variable USE_AZURE_OIDC=true and add:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID

name: Build and deploy Node.js app to Azure Web App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
  NODE_VERSION: '20.x'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: npm install, build, and test
        run: |
          npm ci
          npm run build --if-present
          npm test

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    environment:
      name: Production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      # OIDC: only when repo variable USE_AZURE_OIDC=true (secrets cannot be used in if:)
      - name: Login to Azure (OIDC)
        if: vars.USE_AZURE_OIDC == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Publish profile (default): set AZURE_WEBAPP_PUBLISH_PROFILE secret; leave USE_AZURE_OIDC unset
      - name: Deploy to Azure Web App (publish profile)
        if: vars.USE_AZURE_OIDC != 'true'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .

      # OIDC deploy: no publish profile; azure/login step above must have run
      - name: Deploy to Azure Web App (OIDC)
        if: vars.USE_AZURE_OIDC == 'true'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: .
