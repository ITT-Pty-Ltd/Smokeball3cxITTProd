<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smokeball 3CX Integration Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Animated Background Gradients */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            animation: float 20s infinite ease-in-out alternate;
        }
        
        .orb-1 {
            width: 400px;
            height: 400px;
            background: rgba(59, 130, 246, 0.2);
            top: -100px;
            left: -100px;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: rgba(16, 185, 129, 0.15);
            bottom: -200px;
            right: -100px;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: rgba(139, 92, 246, 0.2);
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-duration: 25s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -50px) scale(1.1); }
            100% { transform: translate(-30px, 20px) scale(0.9); }
        }

        /* Dashboard Container */
        .dashboard {
            width: 90%;
            max-width: 600px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 10;
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .status-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .status-item:hover {
            transform: translateY(-2px);
            background: rgba(0, 0, 0, 0.3);
        }

        .status-label {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 16px;
            font-weight: 600;
        }

        .icon-box {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
        }

        .icon-box svg {
            width: 20px;
            height: 20px;
            stroke: var(--text-secondary);
        }

        .status-value {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .dot.online {
            background-color: var(--success-color);
            box-shadow: 0 0 10px var(--success-color);
            animation: pulse-green 2s infinite;
        }

        .dot.offline {
            background-color: var(--error-color);
            box-shadow: 0 0 10px var(--error-color);
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .action-container {
            text-align: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--accent-color);
            color: white;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.39);
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
        }

        .btn:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .loading-spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(16, 185, 129, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            backdrop-filter: blur(8px);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .message-toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .message-toast.error {
            background: rgba(239, 68, 68, 0.9);
        }

        /* Terminal Logs Container */
        .logs-wrapper {
            margin-top: 30px;
            display: none; /* hidden by default */
            animation: slideUp 0.5s ease forwards;
        }

        .logs-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .terminal {
            background: #0f172a; /* True dark for terminal */
            border: 1px solid var(--card-border);
            border-radius: 12px;
            height: 250px;
            overflow-y: auto;
            padding: 16px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.5;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
            scroll-behavior: smooth;
        }

        .terminal::-webkit-scrollbar {
            width: 8px;
        }

        .terminal::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .terminal::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .log-line {
            display: flex;
            gap: 12px;
            margin-bottom: 4px;
            word-break: break-all;
        }

        .log-time {
            color: #64748b;
            flex-shrink: 0;
            width: 70px;
        }

        .log-level {
            text-transform: uppercase;
            font-weight: bold;
            flex-shrink: 0;
            width: 45px;
        }

        .level-info { color: #3b82f6; }
        .level-error { color: #ef4444; }
        .level-warn { color: #f59e0b; }

        .log-msg {
            color: #e2e8f0;
            white-space: pre-wrap;
        }

    </style>
</head>
<body>

    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <div id="toast" class="message-toast">
        <span id="toast-icon">✓</span>
        <span id="toast-text">Success message</span>
    </div>

    <div class="dashboard">
        <div class="header">
            <h1>Integration Dashboard</h1>
            <p>Middleware connecting 3CX and Smokeball CRM</p>
        </div>

        <div class="status-container">
            <!-- Server Status -->
            <div class="status-item">
                <div class="status-label">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
                            <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
                            <line x1="6" y1="6" x2="6.01" y2="6"></line>
                            <line x1="6" y1="18" x2="6.01" y2="18"></line>
                        </svg>
                    </div>
                    Middleware Server
                </div>
                <div class="status-value">
                    <div class="dot online"></div>
                    Online
                </div>
            </div>

            <!-- Smokeball Auth Status -->
            <div class="status-item">
                <div class="status-label">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </div>
                    Smokeball API
                </div>
                <div class="status-value" id="auth-status-value">
                    <div class="loading-spinner"></div>
                    Checking...
                </div>
            </div>
        </div>

        <div class="action-container" id="action-container" style="display: none;">
            <a href="#" id="auth-btn" class="btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                    <polyline points="10 17 15 12 10 7"></polyline>
                    <line x1="15" y1="12" x2="3" y2="12"></line>
                </svg>
                Authorize Smokeball
            </a>
        </div>

        <div class="logs-wrapper" id="logs-wrapper">
            <div class="logs-header">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="4 17 10 11 4 5"></polyline>
                    <line x1="12" y1="19" x2="20" y2="19"></line>
                </svg>
                Live Server Logs
            </div>
            <div class="terminal" id="terminal-output">
                <!-- Logs will be injected here -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkStatus();
            checkUrlParams();
        });

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            const text = document.getElementById('toast-text');
            
            if (isError) {
                toast.classList.add('error');
                icon.innerHTML = '✕';
            } else {
                toast.classList.remove('error');
                icon.innerHTML = '✓';
            }
            
            text.innerText = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
                // Clean up URL
                window.history.replaceState({}, document.title, "/");
            }, 5000);
        }

        function checkUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('auth') === 'success') {
                showToast('Authentication successful!');
            } else if (urlParams.get('auth') === 'error') {
                const reason = urlParams.get('reason') || 'Authentication failed.';
                showToast(decodeURIComponent(reason), true);
            }
        }

        let logsInterval = null;

        async function checkStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                const authValue = document.getElementById('auth-status-value');
                const actionContainer = document.getElementById('action-container');
                const authBtn = document.getElementById('auth-btn');
                const logsWrapper = document.getElementById('logs-wrapper');

                if (data.authenticated) {
                    authValue.innerHTML = '<div class="dot online"></div> Connected';
                    actionContainer.style.display = 'none';
                    logsWrapper.style.display = 'block';

                    if (!logsInterval) {
                        fetchLogs(); // initial fetch
                        logsInterval = setInterval(fetchLogs, 3000);
                    }
                } else {
                    authValue.innerHTML = '<div class="dot offline"></div> Disconnected';
                    actionContainer.style.display = 'block';
                    logsWrapper.style.display = 'none';
                    authBtn.href = data.installUrl || '/auth/install';
                    
                    if (logsInterval) {
                        clearInterval(logsInterval);
                        logsInterval = null;
                    }
                }

            } catch (error) {
                console.error('Failed to fetch status:', error);
                const authValue = document.getElementById('auth-status-value');
                authValue.innerHTML = '<div class="dot offline"></div> Error';
                showToast('Unable to connect to the server API.', true);
            }
        }

        async function fetchLogs() {
            try {
                const response = await fetch('/api/logs');
                if (!response.ok) return;

                const logs = await response.json();
                const terminal = document.getElementById('terminal-output');
                
                // Track if user is scrolled to bottom before updating
                const isScrolledToBottom = terminal.scrollHeight - terminal.clientHeight <= terminal.scrollTop + 20;

                terminal.innerHTML = logs.map(log => {
                    const time = new Date(log.timestamp).toLocaleTimeString([], { hour12: false });
                    const safeMsg = log.message.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    const levelClass = log.level === 'error' ? 'level-error' : (log.level === 'warn' ? 'level-warn' : 'level-info');
                    
                    return `<div class="log-line">
                        <span class="log-time">${time}</span>
                        <span class="log-level ${levelClass}">${log.level}</span>
                        <span class="log-msg">${safeMsg}</span>
                    </div>`;
                }).join('');

                // Auto-scroll to bottom if they were already at the bottom
                if (isScrolledToBottom) {
                    terminal.scrollTop = terminal.scrollHeight;
                }
            } catch (error) {
                console.error('Failed to fetch logs:', error);
            }
        }
    </script>
</body>
</html>
